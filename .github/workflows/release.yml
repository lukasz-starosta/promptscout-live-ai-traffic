name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run verification and package publish dry-runs without publishing.
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  release:
    name: Release public npm package
    runs-on: ubuntu-latest
    environment: npm
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Unit tests
        run: yarn test

      - name: Repo verification
        run: ./scripts/verify

      - name: Build package
        run: yarn build

      - name: Dry-run package contents
        run: npm pack --dry-run

      - name: Publish public npm package
        if: ${{ !inputs.dry_run }}
        run: npm publish --access public --provenance --registry=https://registry.npmjs.org
