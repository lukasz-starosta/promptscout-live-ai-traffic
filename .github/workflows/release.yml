name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run verification and package publish dry-runs without publishing.
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

env:
  PUBLISH_PACKAGE_DIRS: packages/core packages/vercel-middleware

jobs:
  release:
    name: Release private packages
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@lukasz-starosta"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Unit tests
        run: yarn test

      - name: Repo verification
        run: ./scripts/verify

      - name: Build packages
        run: yarn build

      - name: Dry-run package contents
        if: ${{ inputs.dry_run }}
        run: |
          for package_dir in $PUBLISH_PACKAGE_DIRS; do
            echo "Dry-run packing ${package_dir}"
            (cd "$package_dir" && yarn pack --dry-run)
          done

      - name: Publish private GitHub Packages
        if: ${{ !inputs.dry_run }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YARN_NPM_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            echo "GITHUB_TOKEN is required for real publishes" >&2
            exit 1
          fi

          for package_dir in $PUBLISH_PACKAGE_DIRS; do
            echo "Publishing ${package_dir}"
            current_dir="$PWD"
            cd "$package_dir"
            yarn npm publish --access restricted
            cd "$current_dir"
          done
